# Draws the LGTM.md widgets on this profile every night, private activity included.
name: LGTM.md

on:
  schedule:
    # Just after midnight UTC, so the widgets show the day that just ended.
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/lgtm-md.yml]

permissions:
  contents: write

concurrency: lgtm-md

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a release, since a moving tag runs whatever code it points to on this account.
      - uses: eliorpom-cmd/lgtm.md@v1.1.0
        with:
          # Read-only token, so private contributions and languages are counted.
          token: ${{ secrets.LGTM_MD_TOKEN }}
          widgets: |
            grass
            flame
            departures
          output-dir: widgets
      - name: Commit the widgets if they changed
        shell: bash
        run: |
          git add widgets
          if git diff --cached --quiet; then
            echo "The widgets are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "widgets: draw the day's widgets"
          git push --quiet
